# CustomerAccess: for people who rent the cluster to run their own servers.
#
# Attached to the "customer" group, on top of the defaults every account keeps
# (OwnerAccess: every action on what the account created, chat excluded;
# SelfServiceAccess: its own password, sessions and details). Together they give
# a customer full control of the instances they launched and of the data that
# belongs to them, the whole addon catalog, and nothing of anybody else's.
#
# What stays closed, whatever OwnerAccess would allow, is anything that runs
# code of the customer's choosing on the host (code:*, the terminal, JVM flags
# and environment variables), anything network-wide (moderation, permissions,
# the proxy, port pools, DNS records), and the console's own administration.
# Their own servers' network settings and hostnames are theirs.
#
# Mèo Béo is theirs to use: it acts with these same permissions, and what it
# remembers in their conversations stays theirs (OwnerAccess covers it). The
# operators' own notes are kept from it unless one is tagged for customers.
Version: 1
Statement:
  # starting things of their own: what they create is theirs from then on
  - Sid: CreateOwnResources
    Effect: Allow
    Action:
      - instance:Create
      - addon-group:Create
      - schedule:Create
    Resource: "*"

  # the addon catalog and the shared pool, read in full, so any catalog addon
  # can be found and put on their own servers
  - Sid: BrowseCatalog
    Effect: Allow
    Action:
      - catalog:Read
      - plugin:List
      - plugin:Describe
      - plugin:Install
      - pack:List
      - pack:Describe
      - pack:Install
      - datapack:List
      - datapack:Describe
      - datapack:Install
      - addon-group:List
      - addon-group:Describe
      - profile:List
      - runtime:List
      - instance:List
      - schedule:List
      - job:Describe
      # every machine, so a customer can choose where an instance runs
      - machine:List
      - machine:Describe
    Resource: "*"

  # the chat (and the logs and console that carry it) of servers they own: a
  # server's chat inherits its instance's creator
  - Sid: OwnChatAndLogs
    Effect: Allow
    Action: chat:Read
    Resource: luna:chat/*
    Condition:
      StringEquals:
        luna:ResourceCreator: "${luna:username}"

  # players who have played on one of their servers: the profile, and the chat
  # history (whose lines are kept to the servers they may read)
  - Sid: PlayersOnOwnServers
    Effect: Allow
    Action:
      - player:Describe
      - chat:ReadPlayer
    Resource: luna:player/*
    Condition:
      ForAnyValue:StringEquals:
        luna:PlayerServerCreators: "${luna:username}"

  # a hostname of their own for a server of their own (modded clients cannot
  # come in through the lobby); it always points at the network, and linking it
  # needs network rights on the instance, which OwnerAccess gives on theirs only
  - Sid: OwnHostnames
    Effect: Allow
    Action:
      - domain:List
      - domain:Create
    Resource: "*"

  # Mèo Béo, acting as the customer, with a memory of its own
  - Sid: UseAgent
    Effect: Allow
    Action:
      - agent:Describe
      - agent:Chat
      - knowledge:List
      - knowledge:Create
    Resource: "*"

  # an operator note made for customers (tag it audience=customer), readable by
  # their agent; every other operator note stays out of reach
  - Sid: SharedAgentNotes
    Effect: Allow
    Action: knowledge:Describe
    Resource: luna:knowledge/*
    Condition:
      StringEquals:
        luna:ResourceTag/audience: customer

  # never run code of their choosing on the host: uploaded or linked jars and
  # modpacks, executable files, JVM flags and agents, the terminal, shells
  - Sid: NoArbitraryCode
    Effect: Deny
    Action:
      - code:*
      - shell:*
      # environment variables reach the JVM unread by luna, and the cluster-wide
      # ones carry other people's settings
      - env:*
      - profile:Create
      - profile:Update
      - profile:Delete
      - runtime:Install
      - runtime:Remove
    Resource: "*"

  # nothing network-wide: moderation, in-game permissions, the proxy, ports,
  # hostnames, changing machines, the cluster feed and cleanup
  - Sid: NoNetworkLevel
    Effect: Deny
    Action:
      - player:List
      - player:Act
      - player:Moderate
      - player:ManagePermissions
      - permission-group:*
      - network:*
      - port-pool:*
      # a record aimed anywhere but the network, and the DNS provider itself
      - domain:ManageRecords
      - domain:ConfigureProvider
      - machine:Upgrade
      - machine:Remove
      - event:Read
      - journal:Read
      - cleanup:*
      - publicsite:*
    Resource: "*"

  # the console's own administration: the agent's settings and credential, and
  # the notes every account's agent reads
  - Sid: NoConsoleAdministration
    Effect: Deny
    Action:
      # every IAM verb but reading the policies that reach them and the groups
      # they are in, which SelfServiceAccess grants
      - iam:List*
      - iam:Create*
      - iam:Update*
      - iam:Delete*
      - iam:Attach
      - iam:Detach
      - iam:Simulate
      - iam:ReadAudit
      - account:Administer
      - mcp:*
      - knowledge:Publish
      - agent:Configure
      - account:List
      - account:Create
      - account:Delete
      - account:ReadAudit
    Resource: "*"
