name: release

# Tag a release and this publishes what every daemon upgrades from:
# one self-contained binary per platform (with its sha256 sidecar, which is what
# `luna daemon upgrade` verifies) and the container image on ghcr.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v1.2.3 (no tag is created)"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the platform triple in the asset name is what the daemon matches
          # against its own `process.platform-process.arch` before downloading
          - platform: linux-x64
            target: bun-linux-x64
          - platform: linux-arm64
            target: bun-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve version
        id: version
        run: |
          ref="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build luna-${{ matrix.platform }}
        env:
          LUNA_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run scripts/genversion.ts
          bun build --compile --minify --target=${{ matrix.target }} \
            src/cli/index.ts --outfile luna-${{ matrix.platform }}
          sha256sum luna-${{ matrix.platform }} > luna-${{ matrix.platform }}.sha256

      - name: Verify the build reports the tag
        # cross-built binaries cannot run here, so only the native one is checked
        if: matrix.platform == 'linux-x64'
        run: ./luna-${{ matrix.platform }} version

      - uses: actions/upload-artifact@v4
        with:
          name: luna-${{ matrix.platform }}
          path: |
            luna-${{ matrix.platform }}
            luna-${{ matrix.platform }}.sha256
          if-no-files-found: error

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          bun install --frozen-lockfile
          cd web && bun install --frozen-lockfile

      - name: Build console
        run: cd web && bun run build

      - name: Package
        run: tar -czf luna-console.tar.gz -C web build package.json

      - uses: actions/upload-artifact@v4
        with:
          name: luna-console
          path: luna-console.tar.gz
          if-no-files-found: error

  publish:
    needs: [binaries, console]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.inputs.version || github.ref_name, '-') }}
          files: |
            artifacts/luna-linux-x64
            artifacts/luna-linux-x64.sha256
            artifacts/luna-linux-arm64
            artifacts/luna-linux-arm64.sha256
            artifacts/luna-console.tar.gz

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: |
          ref="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # arm64 is emulated, which is slow but keeps one image for both fleets
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.version.outputs.version, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LUNA_VERSION=${{ steps.version.outputs.version }}
            LUNA_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
