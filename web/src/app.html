<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- No viewport meta on purpose. The console is a desktop layout and is not
	     going to become a responsive one, so a phone should lay it out at its
	     natural width and let the user zoom, rather than reflow it into a column
	     of overlapping panels. The public pages, which *are* responsive, declare
	     the viewport themselves in their own layout. -->
		<link rel="stylesheet" href="%sveltekit.assets%/AlbulaPro/AlbulaPro.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/FontAwesome/FontAwesome.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
